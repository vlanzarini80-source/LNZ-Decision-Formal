
name: P107C Controlled JSON-to-Lean Verification

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request UUID
        required: true
        type: string
      input_sha256:
        description: SHA-256 of original JSON bytes
        required: true
        type: string
      payload_b64:
        description: Base64-encoded JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  main_guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: No compilation on main
        run: |
          echo "P107C_MAIN_GUARD_ONLY"
          echo "NO_LEAN_COMPILATION"
