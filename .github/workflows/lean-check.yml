
name: LNZ Lean Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version

      - name: Generate dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          lake update

      - name: Download mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail
          lake build

      - name: Check main source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZDecisionFormal.lean

      - name: Verify P3.1a lower bound
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZLowerBound.lean 2>&1 | tee p31a-lower.log
          grep -F "'LNZ.objective_lower_bound' depends on axioms:" p31a-lower.log

          if grep -E 'sorryAx|^error:' p31a-lower.log; then
            echo "P3.1a lower bound rejected"
            exit 1
          fi

      - name: Verify P3.1a exchange lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZExchange.lean 2>&1 | tee p31a-exchange.log
          grep -F "depends on axioms:" p31a-exchange.log

          if grep -E 'sorryAx|^error:' p31a-exchange.log; then
            echo "P3.1a exchange rejected"
            exit 1
          fi

      - name: Verify P3.1b global optimality
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZGlobalOptimality.lean 2>&1 | tee p31b.log
          grep -F "'LNZ.global_optimality_box_simplex' depends on axioms:" p31b.log

          if grep -E 'sorryAx|^error:' p31b.log; then
            echo "P3.1b verification rejected"
            exit 1
          fi

      - name: Verify P3.2 certificate bridge
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .lake/build/lib/lean

          lake env lean \
            -o .lake/build/lib/lean/LNZCertificateBridge.olean \
            LNZCertificateBridge.lean \
            2>&1 | tee p32.log

          grep -F "'LNZ.certified_coordinate_exchange' depends on axioms:" p32.log
          grep -F "'LNZ.certified_global_optimality' depends on axioms:" p32.log

          if grep -E 'sorryAx|^error:' p32.log; then
            echo "P3.2 verification rejected"
            exit 1
          fi

          test -s .lake/build/lib/lean/LNZCertificateBridge.olean

      - name: Verify P3.3 certificate payload
        shell: bash
        run: |
          set -euo pipefail

          test -s LNZCertificatePayloadP33.lean
          test -s .lake/build/lib/lean/LNZCertificateBridge.olean

          lake env lean \
            LNZCertificatePayloadP33.lean \
            2>&1 | tee p33.log

          grep -F "'LNZ.valid_box_certificate_optimal' depends on axioms:" p33.log

          if grep -E 'sorryAx|^error:' p33.log; then
            echo "P3.3 verification rejected"
            exit 1
          fi

          echo "P3.3 compilation and basic axiom checks passed"
