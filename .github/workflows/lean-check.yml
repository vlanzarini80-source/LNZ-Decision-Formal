
name: LNZ Lean Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Generate dependency manifest
        run: lake update

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Check source
        run: lake env lean LNZDecisionFormal.lean
