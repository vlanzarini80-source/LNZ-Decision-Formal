
name: LNZ Lean Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean without automatic setup
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: false

      - name: Generate Lake manifest
        run: lake update

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Verify Lean version
        run: lake env lean --version

      - name: Build project
        run: lake build

      - name: Check Lean source
        run: lake env lean LNZDecisionFormal.lean
