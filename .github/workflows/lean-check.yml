
name: LNZ Lean Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Generate dependency manifest
        run: lake update

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Check main source
        run: lake env lean LNZDecisionFormal.lean

      - name: Verify P3.1a lower bound
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZLowerBound.lean 2>&1 | tee p31a-lower.log
          grep -F "'LNZ.objective_lower_bound' depends on axioms:" p31a-lower.log
          if grep -E 'sorryAx|^error:' p31a-lower.log; then
            exit 1
          fi

      - name: Verify P3.1a exchange lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZExchange.lean 2>&1 | tee p31a-exchange.log
          grep -F "depends on axioms:" p31a-exchange.log
          if grep -E 'sorryAx|^error:' p31a-exchange.log; then
            exit 1
          fi

      - name: Verify P3.1b global optimality
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZGlobalOptimality.lean 2>&1 | tee p31b.log
          grep -F "'LNZ.global_optimality_box_simplex' depends on axioms:" p31b.log
          if grep -E 'sorryAx|^error:' p31b.log; then
            echo "P3.1b verification rejected"
            exit 1
          fi
          echo "P3.1b Lean compilation and axiom-output checks passed"
