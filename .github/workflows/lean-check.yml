
name: LNZ Lean Verification

on:
  push:
    branches:
      - main
      - test/p34-json-lean-bridge
  pull_request:
  workflow_dispatch:

jobs:
  lean-check:
    name: lean-check
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: P3.6 Python robustness and oracle tests
        run: |
          set -euo pipefail

          python3 --version

          for file in \
            lnz_p34d.py \
            test_p36.py \
            test_p36_oracle.py
          do
            test -s "$file" || {
              echo "::error::Missing or empty: $file"
              exit 1
            }
          done

          python3 -m unittest -v test_p36 test_p36_oracle

          echo "P36_PYTHON_TESTS_PASS"

      - name: P3.9 independent semantic data audit
        run: |
          set -euo pipefail

          test -s p39_semantic_audit.py || {
            echo "::error::Missing or empty: p39_semantic_audit.py"
            exit 1
          }

          python3 -m py_compile p39_semantic_audit.py

          python3 p39_semantic_audit.py --self-test

          echo "P39_SELF_TEST_PASS"
          echo "P39_REAL_JSON_LEAN_AUDIT_NOT_YET_EXECUTED"

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        run: |
          set -euo pipefail
          cat lean-toolchain
          grep -Fxq "leanprover/lean4:v4.24.0" lean-toolchain
          lake --version
          lean --version

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update

      - name: Download mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build project
        run: |
          set -euo pipefail
          lake build

      - name: Verify required source files
        run: |
          set -euo pipefail

          for file in \
            LNZDecisionFormal.lean \
            LNZLowerBound.lean \
            LNZExchange.lean \
            LNZGlobalOptimality.lean \
            LNZCertificateBridge.lean \
            LNZCertificatePayloadP33.lean \
            P34Generated.lean
          do
            test -s "$file" || {
              echo "::error::Missing or empty: $file"
              exit 1
            }
          done

      - name: Verify main source
        run: |
          set -euo pipefail
          lake env lean LNZDecisionFormal.lean

      - name: Compile Lean dependency chain
        run: |
          set -euo pipefail

          export LEAN_PATH=".:${LEAN_PATH:-}"

          lake env lean -o LNZLowerBound.olean LNZLowerBound.lean
          lake env lean -o LNZExchange.olean LNZExchange.lean
          lake env lean -o LNZGlobalOptimality.olean LNZGlobalOptimality.lean
          lake env lean -o LNZCertificateBridge.olean LNZCertificateBridge.lean
          lake env lean -o LNZCertificatePayloadP33.olean LNZCertificatePayloadP33.lean

          for module in \
            LNZLowerBound \
            LNZExchange \
            LNZGlobalOptimality \
            LNZCertificateBridge \
            LNZCertificatePayloadP33
          do
            test -s "$module.olean" || {
              echo "::error::Missing compiled module: $module"
              exit 1
            }
          done

      - name: Verify P3.3 certificate payload
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"

          lake env lean LNZCertificatePayloadP33.lean

          echo "P3.3 compilation PASS"

      - name: Verify P3.4 generated certificate
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"

          lake env lean P34Generated.lean

          echo "P3.4 generated certificate compilation PASS"

      - name: Check P3.4 theorem and axioms
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"

          cat > P34AxiomAudit.lean <<'EOF'
          import P34Generated

          #check LNZ.p34_instance_optimal
          #print axioms LNZ.p34_instance_optimal
          EOF

          lake env lean -o P34Generated.olean P34Generated.lean
          lake env lean P34AxiomAudit.lean 2>&1 | tee p34_axioms.log

          if grep -Eq 'sorryAx|^.*depends on axioms:.*(sorryAx|[Uu]nsafe)' p34_axioms.log; then
            echo "::error::Unacceptable axiom dependency"
            exit 1
          fi

          echo "P3.4 axiom audit completed"

      - name: Final verification
        run: |
          set -euo pipefail

          echo "P36_PYTHON_TESTS_PASS"
          echo "P39_SELF_TEST_PASS"
          echo "Required Lean files compiled."
          echo "P3.3 and P3.4 checks executed."
          echo "Real JSON-to-Lean semantic audit remains open."
          echo "Python-to-Lean semantic bridge remains a separate proof obligation."
