
name: LNZ Lean Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Generate dependency manifest
        run: lake update

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Check main source
        run: lake env lean LNZDecisionFormal.lean

      - name: Verify objective lower bound theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZLowerBound.lean 2>&1 | tee lean-lower-bound.log
          grep -F "'LNZ.objective_lower_bound' depends on axioms:" lean-lower-bound.log
          if grep -E 'sorryAx|^error:' lean-lower-bound.log; then
            echo "Lower bound verification failed"
            exit 1
          fi

      - name: Verify P3.1a exchange lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZExchange.lean 2>&1 | tee lean-exchange.log
          grep -F "'LNZ.exchange_objective_delta' depends on axioms:" lean-exchange.log
          grep -F "'LNZ.exchange_nonimproving' depends on axioms:" lean-exchange.log
          if grep -E 'sorryAx|^error:' lean-exchange.log; then
            echo "P3.1a verification failed"
            exit 1
          fi
