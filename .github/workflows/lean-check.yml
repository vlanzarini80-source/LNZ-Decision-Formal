
name: LNZ Lean Verification

on:
  push:
    branches:
      - main
      - test/p34-json-lean-bridge
  pull_request:
  workflow_dispatch:

jobs:
  lean-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          cat lean-toolchain
          grep -qx 'leanprover/lean4:v4.24.0' lean-toolchain
          lake --version
          lean --version

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lake-manifest.json ]; then
            lake update
          fi

      - name: Download mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail
          lake build

      - name: Check main source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZDecisionFormal.lean

      - name: Verify P3.1a lower bound
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZLowerBound.lean

      - name: Verify P3.1a exchange lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZExchange.lean

      - name: Verify P3.1b global optimality
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZGlobalOptimality.lean

      - name: Verify P3.2 certificate bridge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZCertificateBridge.lean

      - name: Verify P3.3 certificate payload
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LNZCertificatePayloadP33.lean

      - name: Verify P3.4 generated certificate
        if: github.ref == 'refs/heads/test/p34-json-lean-bridge'
        shell: bash
        run: |
          set -euo pipefail
          test -f P34Generated.lean
          grep -Fq '#print axioms LNZ.p34_instance_optimal' P34Generated.lean
          lake env lean P34Generated.lean
