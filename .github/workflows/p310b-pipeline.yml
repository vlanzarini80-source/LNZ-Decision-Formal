
name: P310b JSON Lean Pipeline

on:
  push:
    branches:
      - test/p34-json-lean-bridge
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          set -euo pipefail
          for file in \
            p310b_pipeline.py \
            p310a_audit.py \
            lnz_p34d.py \
            test_p311_independent.py \
            test_p312_pipeline.py \
            test_p312c1_adversarial.py \
            LNZCertificateBridge.lean \
            LNZCertificatePayloadP33.lean \
            lean-toolchain
          do
            test -s "$file" || {
              echo "::error::Missing or empty: $file"
              exit 1
            }
          done

      - name: Verify Python syntax
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile \
            p310b_pipeline.py \
            p310a_audit.py \
            lnz_p34d.py \
            test_p311_independent.py \
            test_p312_pipeline.py \
            test_p312c1_adversarial.py

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean toolchain
        run: |
          set -euo pipefail
          grep -Fxq \
            "leanprover/lean4:v4.24.0" \
            lean-toolchain
          lake --version
          lean --version

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build

      - name: Compile certificate dependencies
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"

          lake env lean \
            -o LNZCertificateBridge.olean \
            LNZCertificateBridge.lean

          lake env lean \
            -o LNZCertificatePayloadP33.olean \
            LNZCertificatePayloadP33.lean

      - name: Execute P310b end-to-end test
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"
          python3 p310b_pipeline.py

      - name: Execute P312 JSON Python audit
        run: |
          set -euo pipefail

          python3 -u test_p312_pipeline.py \
            2>&1 | tee p312_python.log

          for marker in \
            P312_JSON_PYTHON_AUDIT_PASS \
            P312_DETERMINISTIC_GENERATION_PASS \
            P312_MUTATION_REJECTED \
            P312_LEAN_SOURCE_GENERATED
          do
            grep -Fxq "$marker" p312_python.log || {
              echo "::error::Missing marker: $marker"
              exit 1
            }
          done

          test -s P312Generated.lean
          test -s p312_input.sha256

          echo "P312_PYTHON_CI_PASS"

      - name: Compile freshly generated P312 Lean
        run: |
          set -euo pipefail
          export LEAN_PATH=".:${LEAN_PATH:-}"

          lake env lean \
            -o P312Generated.olean \
            P312Generated.lean \
            2>&1 | tee p312_lean.log

          test -s P312Generated.olean

          grep -Fq \
            "LNZ.p34_instance_optimal" \
            p312_lean.log

          grep -Fq \
            "depends on axioms:" \
            p312_lean.log

          if grep -Eq \
            "sorryAx|unsafe|Lean\.ofReduceBool" \
            p312_lean.log
          then
            echo "::error::Unexpected axiom"
            exit 1
          fi

          echo "P312_LEAN_COMPILE_PASS"

      - name: Execute P312c1 adversarial tests
        run: |
          set -euo pipefail

          python3 -u test_p312c1_adversarial.py \
            2>&1 | tee p312c1_adversarial.log

          for marker in \
            P312C1_PARSER_PASS \
            P312C1_SCHEMA_PASS \
            P312C1_NUMERIC_PASS \
            P312C1_CERTIFICATE_PASS \
            P312C1_GENERATOR_PASS \
            P312C1_ADVERSARIAL_PASS
          do
            grep -Fxq "$marker" \
              p312c1_adversarial.log || {
              echo "::error::Missing marker: $marker"
              exit 1
            }
          done

          echo "P312C2_ADVERSARIAL_CI_PASS"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p312c2-verification-evidence
          path: |
            p312_python.log
            p312_lean.log
            p312c1_adversarial.log
            p312_input.sha256
            P312Generated.lean
          if-no-files-found: warn

      - name: Final status
        run: |
          set -euo pipefail
          echo "P310B_WORKFLOW_COMPLETED"
          echo "P312B_WORKFLOW_COMPLETED"
          echo "P312C2_WORKFLOW_COMPLETED"
