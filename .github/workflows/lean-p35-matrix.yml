
name: LNZ P3.7 Python Lean Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - test/p34-json-lean-bridge
    paths:
      - 'lnz_p34d.py'
      - 'p35_matrix.py'
      - 'test_p36.py'
      - 'test_p36_oracle.py'
      - 'verify_p35.sh'
      - 'LNZ*.lean'
      - 'P34*.lean'
      - 'P35*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean-p35-matrix.yml'

permissions:
  contents: read

jobs:
  verify-p37:
    name: Verify Python and generated Lean certificates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            lnz_p34d.py \
            p35_matrix.py \
            test_p36.py \
            test_p36_oracle.py \
            verify_p35.sh \
            LNZCertificatePayloadP33.lean
          do
            test -s "$file" || {
              echo "::error::Missing or empty: $file"
              exit 1
            }
          done
          echo "P37_REQUIRED_FILES_PASS"

      - name: Python robustness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest -v \
            test_p36 \
            test_p36_oracle \
            2>&1 | tee p37_python.log

          grep -Eq '^OK$' p37_python.log
          echo "P37_PYTHON_TESTS_PASS"

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat lean-toolchain
          grep -Fxq \
            'leanprover/lean4:v4.24.0' \
            lean-toolchain
          lean --version
          lake --version

      - name: Prepare Mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build

      - name: Generate and compile certificates
        shell: bash
        run: |
          set -euo pipefail
          bash verify_p35.sh 2>&1 | tee p37_lean.log

      - name: Audit generated Lean files
        shell: bash
        run: |
          set -euo pipefail

          test -s p37_lean.log

          COUNT="$(
            find p35_generated \
              -maxdepth 1 \
              -type f \
              -name 'P35_*.lean' \
              | wc -l
          )"

          echo "GENERATED_LEAN_FILES=$COUNT"

          if [ "$COUNT" -ne 7 ]; then
            echo "::error::Expected seven generated Lean files"
            exit 1
          fi

          CHECKS="$(
            grep -c '^LEAN_CHECK p35_generated/P35_' \
              p37_lean.log || true
          )"

          echo "LEAN_CHECK_COUNT=$CHECKS"

          if [ "$CHECKS" -ne 7 ]; then
            echo "::error::Expected seven Lean compilation checks"
            exit 1
          fi

          if grep -En \
            'sorryAx|declaration uses sorry' \
            p37_lean.log p35_generated/*.lean; then
            echo "::error::Sorry dependency detected"
            exit 1
          fi

          grep -Fxq \
            'P35_LEAN_COMPILE_ALL_PASS' \
            p37_lean.log

          echo "P37_GENERATED_LEAN_PASS"

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq \
            'P37_PYTHON_TESTS_PASS' \
            <(echo P37_PYTHON_TESTS_PASS)
          test -s p37_python.log
          test -s p37_lean.log
          echo "P37_CI_PASS"
          echo "Seven generated Lean instances compiled."
          echo "Python robustness tests executed."
          echo "General Python-to-Lean semantic equivalence"
          echo "is not yet formally proven."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lnz-p37-verification-evidence
          path: |
            p37_python.log
            p37_lean.log
            p35_generated/*.lean
          if-no-files-found: warn
          retention-days: 30
