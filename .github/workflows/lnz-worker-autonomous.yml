name: LNZ autonomous proof controller
on:
  push:
    branches: [research/isolated-lean-worker]
    paths:
      - worker/autonomous_search.py
      - worker/test_autonomous_search.py
      - .github/workflows/lnz-worker-autonomous.yml
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s worker -p 'test_*.py' -v
      - name: Prepare Lean
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          mkdir -p "$RUNNER_TEMP/lean-dist" "$RUNNER_TEMP/lnz-input"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean-dist" --strip-components=1
          chmod -R a+rX "$RUNNER_TEMP/lean-dist"
          docker pull ubuntu:24.04
      - name: Real Lean feedback integration with scripted generator
        env:
          PYTHONPATH: worker
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,uuid
          from pathlib import Path
          from autonomous_search import search
          from dynamic_proof import audit
          root=Path(os.environ["RUNNER_TEMP"])
          image=subprocess.check_output(["docker","image","inspect","ubuntu:24.04","--format","{{.Id}}"],text=True).strip()
          def verify(source):
              p=root/"lnz-input"/"Candidate.lean"
              p.write_text(source)
              p.chmod(0o644)
              name="lnz-"+uuid.uuid4().hex
              args=["docker","run","--name",name,"--rm","--network","none","--read-only","--cap-drop","ALL","--security-opt","no-new-privileges","--pids-limit","64","--memory","2g","--cpus","2","--user","65534:65534","--tmpfs","/tmp:rw,noexec,nosuid,size=64m","-v",str(root/"lean-dist")+":/opt/lean:ro","-v",str(p)+":/input/Candidate.lean:ro",image,"/opt/lean/bin/lean","/input/Candidate.lean"]
              status="UNAVAILABLE"
              log=""
              try:
                  r=subprocess.run(args,capture_output=True,text=True,timeout=120)
                  log=r.stdout+r.stderr
                  if r.returncode==0 and audit(log):
                      status="ACCEPTED"
                  elif r.returncode==1 and "error:" in log:
                      status="REJECTED"
              finally:
                  subprocess.run(["docker","rm","-f",name],capture_output=True,timeout=15)
              return dict(source_hash=hashlib.sha256(source.encode()).hexdigest(),status=status,diagnostic=log[:8000])
          def scripted_provider(context):
              # Integration fixture, NOT a live AI model.
              return json.dumps(["exact List.reverse_append"] if context["diagnostics"] else ["rfl"])
          result=search("reverse_append",scripted_provider,verify,3)
          print(json.dumps(result,indent=2))
          assert result["status"]=="RUNNER_ACCEPTANCE_UNATTESTED"
          assert [t["status"] for t in result["trace"]]==["REJECTED","ACCEPTED"]
          assert not result["certified"]
          print("REAL_LEAN_FEEDBACK_SCRIPTED_PROVIDER_PASS")
          PY
